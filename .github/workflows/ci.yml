name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.18 is the oldest runtime the plugin declares; 22/24 catch newer
        # Node behaviour changes. macOS is included because DSH Desktop ships
        # its own Node and the app is most often used there.
        node: ['20.18.1', '22', '24']
        os: [ubuntu-latest]
        include:
          - node: '22'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Optional channel packages are the real vendor adapters; the contract
      # probe below compares their auth-method arrays with our descriptors.
      - run: npm ci

      - name: Typecheck (host + client)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Channel package contract
        run: npm run test:contract

      - name: Pack
        run: npm pack --dry-run

  clean-clone:
    name: clean clone install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # lib/ and client/ are build outputs and are not committed. A fresh
      # clone must still be able to run the test suite through pretest.
      - run: rm -rf lib client
      - run: npm test
